[workspace]
resolver = "2"
members = [
    "crates/maple-core",
    "crates/maple-crypto",
    "crates/maple-wz",
    "crates/maple-db",
    "crates/maple-net",
    "crates/maple-game",
    "crates/maple-script",
    "crates/maple-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/anomalyco/MapleStory-Server"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
byteorder = "1"
bytes = "1"
nom = "7"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono"] }
bcrypt = "0.15"
chrono = { version = "0.4", features = ["serde"] }
